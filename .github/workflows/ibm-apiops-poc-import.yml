name: APIC Import (pure specs)

on:
  workflow_dispatch:
    inputs:
      api_file:
        description: "Path to API YAML"
        default: "apis/hello-proxy.yaml"
        required: true
      product_file:
        description: "Path to Product YAML (optional)"
        default: "products/hello-product.yaml"
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APIC_BASE_TCS_EI: ${{ secrets.APIC_BASE_TCS_EI }}        # e.g. https://<env>.../manager
      APIC_BASE_MANAGER_TCS_EI: ${{ secrets.APIC_BASE_MANAGER_TCS_EI }}        # e.g. https://<env>...
      APIC_USERNAME_TCS_EI: ${{ secrets.APIC_USERNAME_TCS_EI }}
      APIC_PASSWORD_TCS_EI: ${{ secrets.APIC_PASSWORD_TCS_EI }}
      APIC_ORG_TCS_EI: ${{ secrets.APIC_ORG_TCS_EI }}          # e.g. try-ai
      APIC_CATALOG_TCS_EI: ${{ secrets.APIC_CATALOG_TCS_EI }}  # e.g. sandbox

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show inputs
        run: |
          echo "API:     ${{ github.event.inputs.api_file }}"
          echo "Product: ${{ github.event.inputs.product_file }}"

      # # Authenticate with APIC (Basic or Cookie mode)
      # - name: Get APIC auth (basic/cookie)
      #   id: auth
      #   run: |
      #     set -euo pipefail
      #     BASE="${APIC_BASE_TCS_EI}"
      #     USER="${APIC_USERNAME_TCS_EI}"
      #     PASS="${APIC_PASSWORD_TCS_EI}"

      #     echo " Checking Basic authentication..."
      #     STATUS=$(curl -sk -o /dev/null -w "%{http_code}" -u "$USER:$PASS" "$BASE/api/orgs")
      #     if [ "$STATUS" = "200" ]; then
      #       echo " Using Basic authentication"
      #       echo "mode=basic" >> $GITHUB_OUTPUT
      #       echo "curl_auth=-u '${USER}:${PASS}'" >> $GITHUB_OUTPUT
      #       exit 0
      #     fi

      #     echo " Trying Cookie-based authentication..."
      #     COOKIE=/tmp/apic_cookie.txt
      #     LOGIN_STATUS=$(curl -sk -o /dev/null -w "%{http_code}" \
      #       -c "$COOKIE" -b "$COOKIE" \
      #       -X POST "$BASE/login" \
      #       -H 'Content-Type: application/json' \
      #       --data "{\"username\":\"$USER\",\"password\":\"$PASS\"}")

      #     if [ "$LOGIN_STATUS" = "200" ] || [ "$LOGIN_STATUS" = "204" ]; then
      #       STATUS=$(curl -sk -o /dev/null -w "%{http_code}" -c "$COOKIE" -b "$COOKIE" "$BASE/api/orgs")
      #       if [ "$STATUS" = "200" ]; then
      #         echo " Using Cookie authentication"
      #         echo "mode=cookie" >> $GITHUB_OUTPUT
      #         echo "cookie_path=$COOKIE" >> $GITHUB_OUTPUT
      #         echo "curl_auth=-c '$COOKIE' -b '$COOKIE'" >> $GITHUB_OUTPUT
      #         exit 0
      #       fi
      #     fi

      #     echo "::error::Authentication failed (basic and cookie both failed). Check APIC_BASE_TCS_EI/credentials."
      #     exit 1

      # Authenticate with APIC (basic/cookie) – keep this as you have it
      - name: Get APIC auth (basic/cookie)
        id: auth
        run: |
          set -euo pipefail
          BASE="${APIC_BASE_MANAGER_TCS_EI}"; USER="${APIC_USERNAME}"; PASS="${APIC_PASSWORD}"
          # Try basic
          if [ "$(curl -sk -o /dev/null -w '%{http_code}' -u "$USER:$PASS" "$BASE/api/orgs")" = "200" ]; then
            echo "curl_auth=-u '${USER}:${PASS}'" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Try cookie
          COOKIE=/tmp/apic_cookie.txt
          if curl -sk -o /dev/null -w '%{http_code}' -c "$COOKIE" -b "$COOKIE" \
               -X POST "$BASE/login" -H 'Content-Type: application/json' \
               --data "{\"username\":\"$USER\",\"password\":\"$PASS\"}" | grep -qE '^(200|204)$'; then
            echo "curl_auth=-c '$COOKIE' -b '$COOKIE'" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "::error::Auth failed"; exit 1

      - name: Install yq (YAML parser)
        run: |
          set -euo pipefail
          VERSION="v4.44.3"
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${VERSION}/yq_linux_amd64" -o /usr/local/bin/yq
          chmod +x /usr/local/bin/yq
          yq --version

      # Create/Update Draft API (tries both endpoint shapes + PUT fallback)
      - name: Create/Update Draft API (with fallbacks)
        run: |
          set -euo pipefail
          API_FILE="${{ github.event.inputs.api_file }}"
          NAME=$(yq -r '.info.name // .info.title // .title' "$API_FILE")
          VER=$(yq -r '.info.version' "$API_FILE")
          echo "API file: $API_FILE"
          echo "Parsed name: $NAME, version: $VER"

          # EP1="${APIC_BASE_TCS_EI}/api/orgs/${APIC_ORG_TCS_EI}/drafts/draft-apis?replace=true"
          # EP2="${APIC_BASE_TCS_EI}/api/orgs/${APIC_ORG_TCS_EI}/drafts/apis?replace=true"
          # EP3="${APIC_BASE_TCS_EI}/api/orgs/${APIC_ORG_TCS_EI}/drafts/apis/${NAME}/${VER}"

          EP1="${APIC_BASE_TCS_EI_MANAGER}/api/orgs/${APIC_ORG_TCS_EI}/drafts/draft-apis?replace=true"
          EP2="${APIC_BASE_TCS_EI_MANAGER}/api/orgs/${APIC_ORG_TCS_EI}/drafts/apis?replace=true"
          EP3="${APIC_BASE_TCS_EI_MANAGER}/api/orgs/${APIC_ORG_TCS_EI}/drafts/apis/${NAME}/${VER}/document"

          post_yaml() {
            local url="$1"
            curl -sk -o /tmp/draft-api.json -w "%{http_code}" \
              -X POST ${{ steps.auth.outputs.curl_auth }} \
              -H "Content-Type: application/yaml" \
              --data-binary @"$API_FILE" \
              "$url"
          }

          put_yaml() {
            local url="$1"
            curl -sk -o /tmp/draft-api.json -w "%{http_code}" \
              -X PUT ${{ steps.auth.outputs.curl_auth }} \
              -H "Content-Type: application/yaml" \
              --data-binary @"$API_FILE" \
              "$url"
          }

          echo "Trying POST $EP1"
          CODE=$(post_yaml "$EP1")
          if [[ "$CODE" == "200" || "$CODE" == "201" ]]; then
            echo " Draft API Created/Updated via draft-apis"
            jq . /tmp/draft-api.json
            exit 0
          fi
          echo "POST $EP1 returned $CODE"

          echo "Trying POST $EP2"
          CODE=$(post_yaml "$EP2")
          if [[ "$CODE" == "200" || "$CODE" == "201" ]]; then
            echo " Draft API Created/Updated via apis"
            jq . /tmp/draft-api.json
            exit 0
          fi
          echo "POST $EP2 returned $CODE"

          echo "Trying PUT $EP3"
          CODE=$(put_yaml "$EP3")
          if [[ "$CODE" == "200" || "$CODE" == "201" || "$CODE" == "204" ]]; then
            echo " Draft API Updated via PUT"
            jq . /tmp/draft-api.json || true
            exit 0
          fi

          echo "::error::All draft API endpoints failed (last code: $CODE)."
          echo "Last response:"; cat /tmp/draft-api.json || true
          exit 1

      # Create/Update Draft Product (tries both endpoint shapes + PUT fallback)
      - name: Create/Update Draft Product (optional, with fallbacks)
        if: ${{ github.event.inputs.product_file != '' }}
        run: |
          set -euo pipefail
          PRODUCT_FILE="${{ github.event.inputs.product_file }}"
          NAME=$(yq -r '.info.name // .info.title // .title' "$PRODUCT_FILE")
          VER=$(yq -r '.info.version' "$PRODUCT_FILE")
          echo "Product file: $PRODUCT_FILE"
          echo "Parsed name: $NAME, version: $VER"

          EP1="${APIC_BASE_TCS_EI}/api/orgs/${APIC_ORG_TCS_EI}/drafts/draft-products?replace=true"
          EP2="${APIC_BASE_TCS_EI}/api/orgs/${APIC_ORG_TCS_EI}/drafts/products?replace=true"
          EP3="${APIC_BASE_TCS_EI}/api/orgs/${APIC_ORG_TCS_EI}/drafts/products/${NAME}:${VER}"

          post_yaml() {
            local url="$1"
            curl -sk -o /tmp/draft-product.json -w "%{http_code}" \
              -X POST ${{ steps.auth.outputs.curl_auth }} \
              -H "Content-Type: application/yaml" \
              --data-binary @"$PRODUCT_FILE" \
              "$url"
          }

          put_yaml() {
            local url="$1"
            curl -sk -o /tmp/draft-product.json -w "%{http_code}" \
              -X PUT ${{ steps.auth.outputs.curl_auth }} \
              -H "Content-Type: application/yaml" \
              --data-binary @"$PRODUCT_FILE" \
              "$url"
          }

          echo "  Trying POST $EP1"
          CODE=$(post_yaml "$EP1")
          if [[ "$CODE" == "200" || "$CODE" == "201" ]]; then
            echo " Draft Product Created/Updated via draft-products"
            jq . /tmp/draft-product.json
            exit 0
          fi
          echo "  POST $EP1 returned $CODE"

          echo "  Trying POST $EP2"
          CODE=$(post_yaml "$EP2")
          if [[ "$CODE" == "200" || "$CODE" == "201" ]]; then
            echo " Draft Product Created/Updated via products"
            jq . /tmp/draft-product.json
            exit 0
          fi
          echo "  POST $EP2 returned $CODE"

          echo "  Trying PUT $EP3"
          CODE=$(put_yaml "$EP3")
          if [[ "$CODE" == "200" || "$CODE" == "201" || "$CODE" == "204" ]]; then
            echo " Draft Product Updated via PUT"
            jq . /tmp/draft-product.json || true
            exit 0
          fi

          echo "::error::All draft Product endpoints failed (last code: $CODE)."
          echo "Last response:"; cat /tmp/draft-product.json || true
          exit 1

      # Publish Product to Catalog
      - name: Publish Product to catalog (contains the API)
        if: ${{ github.event.inputs.product_file != '' }}
        run: |
          set -euo pipefail
          PRODUCT_FILE="${{ github.event.inputs.product_file }}"
          PUB_URL="${APIC_BASE_TCS_EI}/api/catalogs/${APIC_ORG_TCS_EI}/${APIC_CATALOG_TCS_EI}/products?stage=true"
          echo "Publishing Product to catalog: ${APIC_CATALOG_TCS_EI}"
          curl -fsS -X POST ${{ steps.auth.outputs.curl_auth }} \
            -H "Content-Type: application/yaml" \
            --data-binary @"$PRODUCT_FILE" \
            "$PUB_URL" -o /tmp/publish.json
          echo " Product Published:"
          cat /tmp/publish.json | jq .

      # Publish API directly if no Product provided
      - name: Publish API directly (if no product)
        if: ${{ github.event.inputs.product_file == '' }}
        run: |
          set -euo pipefail
          API_FILE="${{ github.event.inputs.api_file }}"
          PUB_URL="${APIC_BASE_TCS_EI}/api/catalogs/${APIC_ORG_TCS_EI}/${APIC_CATALOG_TCS_EI}/apis?stage=true"
          echo "Publishing API directly to catalog: ${APIC_CATALOG_TCS_EI}"
          curl -fsS -X POST ${{ steps.auth.outputs.curl_auth }} \
            -H "Content-Type: application/yaml" \
            --data-binary @"${API_FILE}" \
            "$PUB_URL" -o /tmp/api-publish.json
          echo " API Published:"
          cat /tmp/api-publish.json | jq .
