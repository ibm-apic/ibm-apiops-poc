openapi: '3.0.0'
info:
  version: '1.0.0'
  title: 'hello-proxyy'
  x-ibm-name: 'hello-proxyy'
servers:
  - url: '/hello'
x-ibm-configuration:
  properties:
    target-url:
      value: 'https://httpbin.org/anything'
      description: 'URL of the proxy policy'
      encoded: false
  cors:
    enabled: true
  gateway: 'datapower-api-gateway'
  type: 'rest'
  phase: 'realized'
  enforced: true
  testable: true
  assembly:
    execute:
      - log:
          version: '2.1.0'
          title: 'log'
          log-level: '$(request.verb) $(api.operationPath) $(request.client.ip)'
          mode: 'gather-only'
      - parse:
          version: '2.2.0'
          title: 'parse-body'
          parse-settings-reference:
            default: 'apic-default-parsesettings'
          use-content-type: false
      - map:
          inputs:
            X-Demo-Policy:
              schema:
                type: 'string'
              variable: 'request.body.X-Demo-Policy'
          outputs:
            X-Demo-Policy:
              schema:
                type: 'string'
              variable: 'message.body.X-Demo-Policy'
          actions:
            - set: 'X-Demo-Policy'
              from: 'X-Demo-Policy'
              value: 'active'
              default: 'active'
          version: '2.1.0'
          title: 'map'
          options:
            mapEmulateV4EmptyJSONObject: false
            mapEmulateV4DefaultRequiredProps: false
            mapEnablePostProcessingJSON: false
            mapReferenceLimit: 1
      - invoke:
          version: '2.0.0'
          title: 'invoke'
          backend-type: 'detect'
          header-control:
            type: 'blocklist'
            values: []
          parameter-control:
            type: 'allowlist'
            values: []
          timeout: 60
          verb: 'keep'
          chunked-uploads: true
          persistent-connection: true
          target-url: '$(target-url)'
          follow-redirects: false
          inject-proxy-headers: true
  activity-log:
    enabled: true
    success-content: 'activity'
    error-content: 'payload'
paths:
  /:
    get:
      responses:
        '200':
          description: 'success'
          content:
            application/json:
              schema:
                type: 'string'
    put:
      responses:
        '200':
          description: 'success'
          content:
            application/json:
              schema:
                type: 'string'
    post:
      responses:
        '200':
          description: 'success'
          content:
            application/json:
              schema:
                type: 'string'
    delete:
      responses:
        '200':
          description: 'success'
          content:
            application/json:
              schema:
                type: 'string'
    head:
      responses:
        '200':
          description: 'success'
          content:
            application/json:
              schema:
                type: 'string'
    patch:
      responses:
        '200':
          description: 'success'
          content:
            application/json:
              schema:
                type: 'string'
components:
  securitySchemes:
    clientID:
      type: 'apiKey'
      in: 'header'
      name: 'X-IBM-Client-Id'
security:
  - clientID: []
